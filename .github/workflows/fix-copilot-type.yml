name: Apply Copilot type correction

on:
  push:
    branches:
      - feat/final-product-completion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-product-completion
      - name: Apply correction
        run: python3 scripts/fix-copilot-type.py
      - name: Check diff
        run: git diff --check
      - name: Remove temporary helpers
        run: |
          git rm scripts/fix-copilot-type.py
          git rm .github/workflows/fix-copilot-type.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/copilot.ts docs/PROJECT_EXECUTION_MEMORY.md
          git commit -m "fix: guard missing copilot experiment"
          git push origin HEAD:feat/final-product-completion
