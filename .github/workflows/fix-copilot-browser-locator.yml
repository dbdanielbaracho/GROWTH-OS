name: Apply Copilot browser locator fix

on:
  push:
    branches:
      - feat/final-product-completion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-product-completion
      - name: Apply locator fix
        run: python3 scripts/fix-copilot-browser-locator.py
      - name: Validate diff
        run: git diff --check
      - name: Remove temporary helpers
        run: |
          git rm scripts/fix-copilot-browser-locator.py
          git rm .github/workflows/fix-copilot-browser-locator.yml
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/growth-os.browser.spec.ts
          git commit -m "test: scope copilot evidence assertion"
          git push origin HEAD:feat/final-product-completion
