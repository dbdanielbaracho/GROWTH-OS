name: Patch automation UI once

on:
  push:
    branches:
      - feat/automation-action-execution
    paths:
      - .github/workflows/patch-automation-ui-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automation-action-execution
          fetch-depth: 0
      - name: Patch automation UI message
        run: python .github/scripts/patch_automation_ui_message.py
      - name: Validate diff
        run: git diff --check
      - name: Commit UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx
          git commit -m "fix: clarify unconfirmed automation execution state"
          git push origin "HEAD:${GITHUB_REF_NAME}"
