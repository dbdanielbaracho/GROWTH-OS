name: Browser Quality Diagnostics

on:
  push:
    branches: ["feat/browser-quality-gate"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run browser quality gate
        run: npm test --workspace=@growth-os/web

      - name: Upload browser quality diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-diagnostics
          path: test-results/**
          if-no-files-found: warn
          retention-days: 7
