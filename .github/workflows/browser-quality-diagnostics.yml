name: Browser Quality Diagnostics

on:
  push:
    branches: ["feat/browser-quality-gate"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run browser quality gate
        run: npm test --workspace=@growth-os/web

      - name: Locate browser quality diagnostics
        if: ${{ always() }}
        run: find . -maxdepth 7 -type f \( -name 'playwright-results.json' -o -name 'trace.zip' -o -name '*.png' \) -print

      - name: Upload browser quality diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-diagnostics
          path: |
            test-results/**
            apps/web/test-results/**
            tests/browser/test-results/**
          if-no-files-found: error
          retention-days: 7
