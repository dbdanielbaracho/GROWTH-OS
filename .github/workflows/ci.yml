name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growth_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d growth_os_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI_DATABASE_NAME: growth_os_ci
      CI_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/growth_os_ci
      CI_MIGRATOR_URL: postgresql://growth_migrator:growth_migrator@127.0.0.1:5432/growth_os_ci
      CI_APP_URL: postgresql://app_runtime:app_runtime@127.0.0.1:5432/growth_os_ci
      CI_HARNESS_URL: postgresql://growth_test_harness:growth_test_harness@127.0.0.1:5432/growth_os_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test Integrity Gate
        run: node db/scripts/test-integrity-gate.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Provision isolated CI roles
        env:
          PGPASSWORD: postgres
        run: |
          psql --host=127.0.0.1 --port=5432 --username=postgres --dbname="$CI_DATABASE_NAME" --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'growth_migrator') THEN
              CREATE ROLE growth_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'growth_migrator';
            ELSE
              ALTER ROLE growth_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'growth_migrator';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_runtime') THEN
              CREATE ROLE app_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'app_runtime';
            ELSE
              ALTER ROLE app_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'app_runtime';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'growth_rls_helper') THEN
              CREATE ROLE growth_rls_helper NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
            ELSE
              ALTER ROLE growth_rls_helper NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'growth_identity_helper') THEN
              CREATE ROLE growth_identity_helper NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
            ELSE
              ALTER ROLE growth_identity_helper NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS;
            END IF;
          END
          $$;
          GRANT CONNECT, CREATE ON DATABASE growth_os_ci TO growth_migrator;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          SQL

      - name: Apply every canonical migration to isolated CI database
        run: |
          for migration in db/migrations/*.sql; do
            database_url="$CI_MIGRATOR_URL"
            case "$migration" in
              *002_rc9_security_policy_fix.sql|*006_identity_v1.sql|*009_production_identity_adapter_support.sql|*012_youtube_rls_helper_execute.sql|*016_identity_signup_verification.sql|*017_instagram_connector_foundation.sql)
                database_url="$CI_ADMIN_URL"
                ;;
            esac
            DATABASE_URL="$database_url" node db/scripts/apply-migration.mjs "$migration"
          done

      - name: Grant runtime schema usage in isolated CI database
        env:
          PGPASSWORD: postgres
        run: |
          psql --host=127.0.0.1 --port=5432 --username=postgres --dbname="$CI_DATABASE_NAME" --set=ON_ERROR_STOP=1 --command="GRANT USAGE ON SCHEMA growth TO app_runtime"

      - name: Provision test-only Growth Intelligence fixtures
        env:
          PGPASSWORD: postgres
        run: |
          psql --host=127.0.0.1 --port=5432 --username=postgres --dbname="$CI_DATABASE_NAME" --set=ON_ERROR_STOP=1 --file=db/provisioning/test/01_test_roles.sql
          psql --host=127.0.0.1 --port=5432 --username=postgres --dbname="$CI_DATABASE_NAME" --set=ON_ERROR_STOP=1 --file=db/provisioning/test/02_test_membership.sql
          psql --host=127.0.0.1 --port=5432 --username=postgres --dbname="$CI_DATABASE_NAME" --set=ON_ERROR_STOP=1 --command="ALTER ROLE growth_test_harness PASSWORD 'growth_test_harness'"
          PGPASSWORD=growth_test_harness psql --host=127.0.0.1 --port=5432 --username=growth_test_harness --dbname="$CI_DATABASE_NAME" --set=ON_ERROR_STOP=1 --file=db/provisioning/test/03_test_fixtures.sql

      - name: Run SQL gates against isolated CI database
        env:
          PGPASSWORD: growth_migrator
        run: |
          psql --host=127.0.0.1 --port=5432 --username=growth_migrator --dbname="$CI_DATABASE_NAME" --set=ON_ERROR_STOP=1 --file=db/tests/033_youtube_growth_intelligence.sql

      - name: Run identity SQL gate
        env:
          PGPASSWORD: app_runtime
        run: |
          psql --host=127.0.0.1 --port=5432 --username=app_runtime --dbname="$CI_DATABASE_NAME" --set=ON_ERROR_STOP=1 --file=db/tests/034_identity_signup.sql

      - name: Run Instagram SQL gate
        env:
          PGPASSWORD: growth_migrator
        run: |
          psql --host=127.0.0.1 --port=5432 --username=growth_migrator --dbname="$CI_DATABASE_NAME" --set=ON_ERROR_STOP=1 --file=db/tests/035_instagram_connector.sql

      - name: Run Instagram lifecycle SQL gate
        env:
          PGPASSWORD: growth_migrator
        run: |
          psql --host=127.0.0.1 --port=5432 --username=growth_migrator --dbname="$CI_DATABASE_NAME" --set=ON_ERROR_STOP=1 --file=db/tests/036_instagram_token_lifecycle.sql

      - name: Run Instagram media and metrics SQL gate
        env:
          PGPASSWORD: growth_migrator
        run: |
          psql --host=127.0.0.1 --port=5432 --username=growth_migrator --dbname="$CI_DATABASE_NAME" --set=ON_ERROR_STOP=1 --file=db/tests/037_instagram_media_metrics_sync.sql

      - name: Run Growth Intelligence integration test
        env:
          DATABASE_URL: ${{ env.CI_APP_URL }}
          HARNESS_DATABASE_URL: ${{ env.CI_HARNESS_URL }}
        run: npx tsx apps/api/integration-tests/growth-intelligence.integration.mts

      - name: Production same-origin web shell gate
        env:
          NODE_ENV: production
          APP_ORIGIN: https://ci.growth-os.invalid
          CSRF_SECRET: ci-only-csrf-secret-with-more-than-32-characters
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: npx tsx apps/api/integration-tests/production-web-shell.integration.mts

      - name: Test
        run: npm test
