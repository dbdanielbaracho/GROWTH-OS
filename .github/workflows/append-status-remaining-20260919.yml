name: Append current remaining-work status

on:
  push:
    branches:
      - docs/status-remaining-20260919

permissions:
  contents: write

jobs:
  append-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/status-remaining-20260919
      - name: Append staged status entry
        shell: bash
        run: |
          cat docs/tmp-status-remaining-20260919.md >> docs/PROJECT_EXECUTION_MEMORY.md
          git rm docs/tmp-status-remaining-20260919.md
          git rm .github/workflows/append-status-remaining-20260919.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_EXECUTION_MEMORY.md
          git commit -m "docs: record current remaining Growth OS work"
          git push origin HEAD:docs/status-remaining-20260919
