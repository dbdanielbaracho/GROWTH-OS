name: Append no-TinyFish operating rule once

on:
  push:
    branches:
      - docs/continuation-pr197-production-20260918
    paths:
      - .github/workflows/append-no-tinyfish-rule-once.yml

permissions:
  contents: write

jobs:
  append-rule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/continuation-pr197-production-20260918
          fetch-depth: 0
      - name: Append central memory rule
        shell: bash
        run: |
          printf '%s' '' | base64 -d >> docs/PROJECT_EXECUTION_MEMORY.md
      - name: Add current-state rule
        shell: bash
        run: |
          python -c 'from pathlib import Path; import base64; p=Path("PROJECT_CURRENT_STATE.md"); t=p.read_text(encoding="utf-8"); a="- Live authenticated YouTube retest after PR #197 remains OPEN."; r=base64.b64decode("").decode(); i=t.find(a); assert i>=0 or r in t; e=t.find("\n",i) if i>=0 else -1; p.write_text(t if r in t else t[:e+1]+r+t[e+1:],encoding="utf-8")'
      - name: Commit rule
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_EXECUTION_MEMORY.md PROJECT_CURRENT_STATE.md
          git diff --cached --check
          git commit -m "docs: record no-TinyFish operating rule"
          git push origin "HEAD:${GITHUB_REF_NAME}"
