name: Apply final product completion integration

on:
  push:
    branches:
      - feat/final-product-completion

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/final-product-completion
      - name: Apply integration patch
        run: python3 scripts/final-product-completion-patch.py
      - name: Validate patch whitespace
        run: git diff --check
      - name: Remove temporary patch helpers
        run: |
          git rm scripts/final-product-completion-patch.py
          git rm .github/workflows/final-product-completion-patch.yml
      - name: Commit final integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts apps/web/src/api.ts apps/web/src/analytics-panel.tsx apps/web/index.html docs/PROJECT_EXECUTION_MEMORY.md
          git commit -m "feat: complete evidence-grounded product controls"
          git push origin HEAD:feat/final-product-completion
