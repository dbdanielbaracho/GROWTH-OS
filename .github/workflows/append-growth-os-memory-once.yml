name: Append Growth OS continuation record once

on:
  push:
    branches:
      - docs/continuation-pr197-production-20260918
    paths:
      - .github/workflows/append-growth-os-memory-once.yml

permissions:
  contents: write

jobs:
  append-record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@v4
        with:
          ref: docs/continuation-pr197-production-20260918
          fetch-depth: 0

      - name: Append central memory
        shell: bash
        run: |
          printf '%s' '' | base64 -d >> docs/PROJECT_EXECUTION_MEMORY.md

      - name: Reconcile current checkpoint
        shell: bash
        run: |
          python -c 'from pathlib import Path; import base64; p=Path("PROJECT_CURRENT_STATE.md"); t=p.read_text(encoding="utf-8"); m="Purpose: single operational checkpoint for resuming Growth OS work without relying on chat memory.\n"; h="## Current accepted checkpoint — 2026-09-18 — PR #197 runtime"; b=base64.b64decode("").decode(); assert m in t or h in t; p.write_text(t if h in t else t.replace(m,m+b,1),encoding="utf-8")'

      - name: Commit documentation record
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_EXECUTION_MEMORY.md PROJECT_CURRENT_STATE.md
          git diff --cached --check
          git commit -m "docs: record PR 197 production continuation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
