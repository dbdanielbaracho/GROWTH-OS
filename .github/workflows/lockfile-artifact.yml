name: Lockfile Artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Switch canonical CI to npm ci and remove generator
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.github/workflows/ci.yml';
          const from = '        run: npm install --no-audit --no-fund\n';
          const to = '        run: npm ci --no-audit --no-fund\n';
          const current = fs.readFileSync(path, 'utf8');
          if (!current.includes(from)) {
            throw new Error('Expected canonical npm install step was not found');
          }
          fs.writeFileSync(path, current.replace(from, to));
          NODE
          git rm .github/workflows/lockfile-artifact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "chore: enforce deterministic npm ci installs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
