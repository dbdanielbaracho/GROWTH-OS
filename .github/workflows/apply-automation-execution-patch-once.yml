name: Apply automation execution patch once

on:
  push:
    branches:
      - feat/automation-action-execution
    paths:
      - .github/workflows/apply-automation-execution-patch-once.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automation-action-execution
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/apply_automation_execution_patch.py
      - name: Validate diff
        run: git diff --check
      - name: Keep workflow changes for connector-managed update
        run: |
          git checkout -- .github/workflows/ci.yml
          rm .github/scripts/apply_automation_execution_patch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire approved automation execution"
          git push origin "HEAD:${GITHUB_REF_NAME}"
